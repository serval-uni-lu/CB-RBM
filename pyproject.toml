[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbrbm"
version = "0.1.0"
description = "Context-Boosted RBM for label-free adversarial detection on attributed graphs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Firas Bayram"}]
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.23", "scikit-learn>=1.2"]

[tool.setuptools]
packages = ["cbrbm"]
